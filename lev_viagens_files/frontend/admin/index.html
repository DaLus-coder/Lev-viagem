<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- ================= META CONFIG ================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- css defalt link -->
    <link rel="stylesheet" href="index.css">

    <!-- favicon link -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='white' stroke='black' stroke-width='1.5' d='M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.3l.9-4.6c.1-.4 0-.8-.3-1.1L14 1 7.6 7.4C7.2 7.8 7 8.3 7 8.9V19c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7c.1-.2.2-.5.2-.8v-1z'/%3E%3C/svg%3E">

    <title>CMS - ViagensLev</title>
</head>

<body>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>


    <!-- MENU MOBILE -->
    <button class="menu-toggle" id="menuToggle">
        ☰
    </button>



    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">


        <button onclick="logoutAdmin()">
            Sair
        </button>


        <h2>
            CMS ViagensLev
        </h2>



        <button class="nav-item active" onclick="mostrarSecao('cards')">

            Cards

        </button>



        <button class="nav-item" onclick="mostrarSecao('clientes')">

            Clientes

        </button>



        <button class="nav-item">

            Reservas

        </button>


    </aside>





    <!-- CONTEÚDO -->
    <div class="cms-content">





        <!-- =========================
     SEÇÃO CARDS
========================= -->

        <div id="secaoCards">


            <h1>
                Gerenciar Cards
            </h1>



            <input id="titulo" placeholder="Título">



            <input id="descricao" placeholder="Descrição">





            <input type="file" id="file">



            <button type="button" onclick="uploadImagem()" class="upload-btn">

                Upload imagem

            </button>





            <input id="imagem">





            <select id="categoria">


                <option value="alugueis">
                    Alugueis
                </option>


                <option value="experiencias">
                    Experiencias
                </option>


                <option value="gastronomia">
                    Gastronomia
                </option>


            </select>





            <input id="botao_texto" placeholder="Texto botão">





            <button id="btnSalvar" class="save-btn" onclick="saveCard()">

                Salvar card

            </button>




            <hr>





            <!-- LISTAGEM DOS CARDS -->

            <div id="cards">

                <h2>Aluguéis</h2>
                <div id="listaAlugueis" class="categoria-cards"></div>


                <h2>Experiências</h2>
                <div id="listaExperiencias" class="categoria-cards"></div>


                <h2>Gastronomia</h2>
                <div id="listaGastronomia" class="categoria-cards"></div>

            </div>



        </div>








        <!-- =========================
     SEÇÃO CLIENTES
========================= -->


        <div id="clientes" style="display:none;">



            <h1>
                Clientes cadastrados
            </h1>




            <h2>
                Editar cliente
            </h2>




            <input id="clienteNome" placeholder="Nome">



            <input id="clienteEmail" placeholder="Email">



            <input id="clienteCidade" placeholder="Cidade">



            <input id="clienteTelefone" placeholder="Telefone">





            <button class="save-btn" onclick="salvarCliente()">

                Salvar alterações

            </button>







            <table border="1" width="100%" style="margin-top:20px;background:white;">



                <thead>


                    <tr>

                        <th>
                            ID
                        </th>


                        <th>
                            Nome
                        </th>


                        <th>
                            Email
                        </th>


                        <th>
                            Cidade
                        </th>


                        <th>
                            Telefone
                        </th>


                        <th>
                            Ações
                        </th>


                    </tr>


                </thead>





                <tbody id="listaClientes">


                </tbody>





            </table>




        </div>






    </div>


    <div id="loadingOverlay" class="loading-overlay">

        <div class="spinner"></div>

        <p>Carregando...</p>

    </div>


    <!-- SCRIPT PRINCIPAL -->
    <script src="admin.js"></script>



</body>

</html>
